# PBR-Test build and release
#
# What it does
#   On every push to pbr-test-s3ds-mt-sss that touches the engine, gamedata or tools (and on a
#   manual run from the Actions tab), this workflow:
#     1. packs gamedata/ (PBR, SSLR and CSM shaders, scripts, configs) into
#        db/mods/00_modded_exes_gamedata.db0, exactly like upstream Modded Exes;
#     2. builds the exes listed in the build matrix with MSBuild (DX11 and DX11-AVX by default,
#        the only renderer PBR runs on), plus ProfiledDX11: the DX11 exe with the Optick profiler
#        compiled in, shipped separately as AnomalyDX11_Profiled.exe (see "Profiled build" below);
#     3. zips the user-facing tools (compat patch generator, shader pack builder, texture packer);
#     3b. builds the GAMMA shader installer PBR_shaders_GAMMA_FOMOD.zip (overlay or full pack,
#        tools/make_shader_fomod.py over build_shader_packs.py's zips; job "shader_packs", see
#        "Shader packs" below), when the sources repository is set up;
#     4. publishes a GitHub Release anyone can download without a GitHub account:
#        - push / manual "latest": the rolling pre-release "pbr-test-latest" is replaced with
#          the new build (one release, always the newest commit);
#        - manual "versioned": a permanent release "pbr-test-<version>" (version defaults to
#          today's date, e.g. 2026.10.13), kept alongside the rolling one;
#        - manual "none": build only, the files are attached to the workflow run (GitHub login
#          needed to download those, and they expire after RETENTION_DAYS).
#     Branches built from pbr-test-s3ds-mt-sss get their own releases, named after what follows
#     that name: pbr-test-s3ds-mt-sss-lass publishes "pbr-test-lass-latest" /
#     "pbr-test-lass-<version>" and STALKER-Anomaly-PBR-Test-lass_*.zip, so it never replaces
#     the main branch's release. Any other branch gets "pbr-test-<branch>-...".
#
# oneTBB (branches with sdk/binaries/tbb12.dll): bin/ gets tbb12.dll, the task scheduler the
# exes link against (oneTBB 2023.0.0). The exes do not start without it.
#
# DLSS / FSR3 branches (name ends in "-dlss", e.g. pbr-test-s3ds-mt-sss-lass-dlss)
#   - bin/ also gets NVIDIA's DLSS runtime, nvngx_dlss.dll, downloaded from NVIDIA's own
#     repository and checked against DLSS_DLL_SHA256 (the build fails if it does not match).
#     FSR3 is built into the exe and needs no DLL.
#   - The DLSS / FSR3 shader compatibility patch (brodrigz, .github/pbr-release/dlss/) is
#     attached to the release; the in-game DLSS/FSR3 shaders come only from it. It is brodrigz's
#     0.5 plus components for the October 2026 Atmospherics update (atmos_2026_10,
#     better_beefs_atmos_2026_10), made by tools/make_dlss_atmos_component.py from that
#     Atmospherics' own shaders with his DLSS edits.
#   - The shader packs are built twice, for the plain GAMMA stack and with that patch's
#     components on top of it (DLSS_PATCH_COMPONENTS); the FOMOD's second page picks between
#     them. Overlay + DLSS: DLSS patch first, then the PBR overlay above it.
#
# Profiled build (ProfiledDX11)
#   Upstream's ProfiledDX11 configuration defines XRCORE_PROFILER, so every PROF_EVENT /
#   PROF_TAG / PROF_FRAME in the engine (about 500 markers, the qkff99 shadow / HOM / grass
#   counters included) is live and the Optick GUI can connect to the running game. The other
#   configurations compile those markers out.
#   - Shipped as <package>_profiled.zip: bin/AnomalyDX11_Profiled.exe, renamed so it can sit next
#     to the normal AnomalyDX11.exe; it uses the same db0 and gamedata as the main zip.
#   - Its PDB keeps the name the linker wrote into the exe (AnomalyDX11.pdb), so it is in
#     symbols/ of that zip, not next to the exe: it would clash with the release PDB. Optick's
#     events and tags need no PDB; only sampled callstacks (and a debugger) do.
#   - The leg may fail without stopping the release (continue-on-error): the main zips still
#     ship, just without the profiled one. Remove "ProfiledDX11" from the matrix to skip it.
#   - Slower than the release exe while the profiler is linked in, and more so while capturing.
#
# Settings: the env block below and the build matrix (add "DX10" etc. if you want the other
# renderers; they do not run PBR).
#
# Requirements / caveats
#   - Forks start with Actions disabled: enable them once in the repository's Actions tab.
#   - Settings > Actions > General > Workflow permissions must allow "Read and write" for the
#     release step (it uses the built-in GITHUB_TOKEN, no secrets needed).
#   - A full engine build takes a long time per configuration on GitHub's Windows runners; two
#     configurations run in parallel. A newer push cancels a build still in progress.
#   - Upstream's own workflow (msbuild.yml) only triggers on upstream's branch and stays inert here.
#   - SSS / Enhanced Shaders files are not in this repository (they belong to their authors).
#     Users with SSS/ES generate the compatibility patch from their own copies with the tools zip.
#
# Shader packs (GAMMA)
#   The GAMMA shader packs (overlay and full pack, inside one FOMOD) are built from Screen Space
#   Shaders, Enhanced Shaders, Atmospherics, Beef's NVGs and GAMMA's shader overrides, shipped in
#   the release with their authors' permission. The source archives live in a PRIVATE repository, so they are not public here:
#     - create a private repository with the layout described in
#       .github/pbr-release/build_shader_packs.py (es/, sss/, atmospherics/, beef/, gamma/ with
#       gamma/order.txt, optional vanilla/ for the DXC compile check);
#     - Settings > Secrets and variables > Actions:
#         Variables: PBR_SOURCES_REPO = owner/name of that repository
#         Secrets:   PBR_SOURCES_TOKEN = a fine-grained token with read-only "Contents" access
#                    to that repository only
#   Without them the job is skipped with a notice and the release has no shader installer. If
#   the build or the compile check fails, the release still goes out, without it.
#   The packs follow this branch's tools and shaders; changing only the sources repository
#   does not trigger a build: run the workflow manually afterwards.

name: PBR-Test build

on:
  push:
    branches: [ "pbr-test-s3ds-mt-sss", "pbr-test-s3ds-mt-sss-lass", "pbr-test-s3ds-mt-sss-lass-dlss", "pbr-test-s3ds-mt-sss-lass-skin-dlss" ]
    paths:
      - "src/**"
      - "gamedata/**"
      - "compressor/**"
      - "tools/**"
      - ".github/workflows/pbr-build.yml"
      - ".github/pbr-release/**"
  workflow_dispatch:
    inputs:
      release:
        description: "What to publish"
        type: choice
        options: [ "latest", "versioned", "none" ]
        default: "latest"
      version:
        description: "Version for a versioned release (empty = today's date, e.g. 2026.10.13)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: pbr-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln
  PACK_GAMEDATA_NAME: 00_modded_exes_gamedata.db0
  PACKAGE_NAME: STALKER-Anomaly-PBR-Test
  RETENTION_DAYS: 3
  # DLSS branches only (see above). NVIDIA DLSS 310.9.1, the runtime brodrigz's 0.5 build uses.
  DLSS_DLL_URL: https://raw.githubusercontent.com/NVIDIA/DLSS/v310.9.1/lib/Windows_x86_64/rel/nvngx_dlss.dll
  DLSS_DLL_SHA256: 3975567b8943c53acce397f2b72380092f84f162d00b0d2c7d08a1025c563983
  DLSS_PATCH_ZIP: .github/pbr-release/dlss/dlss-binaries-GAMMA-compatibility-patch-0.5.zip
  # Patch components stacked on top of the GAMMA shader sources, lowest first. "base" is the
  # SSS 23.5 part; then the Atmospherics components matching the sources repository's
  # atmospherics/. The packs target the October 2026 Atmospherics update only (it is faster;
  # the older versions are not supported by these packs): "atmos_2026_10" (its AO, IL, SSR, SSS
  # and terrain shaders; Atmospherics' SSR / IL files are needed whatever its ATMOS_SSR /
  # ATMOS_IL choice). Other values: "atmos_rc7" for 2.69 RC7.x, nothing for 2.68.93.
  DLSS_PATCH_COMPONENTS: base atmos_2026_10

jobs:
  pack_gamedata:
    name: Pack gamedata
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack gamedata into ${{ env.PACK_GAMEDATA_NAME }}
        shell: pwsh
        run: |
          New-Item -Path "./compressor/gamedata" -ItemType Directory -Force | Out-Null
          Copy-Item -Path "./gamedata/*" -Destination "./compressor/gamedata" -Recurse -Force
          Set-Location ./compressor
          Start-Process -FilePath "./! compress_gamedata.cmd" -Wait -NoNewWindow
          if (-not (Test-Path gamedata.db0)) { throw "xrCompress did not produce gamedata.db0" }
          Rename-Item -Path gamedata.db0 -NewName "${{ env.PACK_GAMEDATA_NAME }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gamedata
          path: ./compressor/${{ env.PACK_GAMEDATA_NAME }}
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  build:
    name: Build ${{ matrix.buildconf }}
    runs-on: windows-latest
    # The profiled leg is a developer extra: its failure must not hold back the release
    continue-on-error: ${{ matrix.buildconf == 'ProfiledDX11' }}
    strategy:
      fail-fast: false
      matrix:
        buildconf: [ "DX11", "DX11-AVX", "ProfiledDX11" ]
    steps:
      - name: Configure pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 8GB
          maximum-size: 8GB
          disk-root: "C:"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build ${{ matrix.buildconf }}
        run: msbuild /p:Configuration=${{ matrix.buildconf }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Collect exe and PDB
        shell: pwsh
        run: |
          $bin = "./_build/_game/bin_dbg"
          if (-not (Get-ChildItem "$bin/*.exe" -ErrorAction SilentlyContinue)) { throw "no exe in $bin" }
          New-Item -ItemType Directory -Force out | Out-Null
          if ("${{ matrix.buildconf }}" -eq "ProfiledDX11") {
            # Same TargetName as the release DX11 exe: rename it so both can live in bin/
            if (-not (Test-Path "$bin/AnomalyDX11.exe")) { throw "no AnomalyDX11.exe from ProfiledDX11" }
            Copy-Item "$bin/AnomalyDX11.exe" out/AnomalyDX11_Profiled.exe
            Copy-Item "$bin/AnomalyDX11.pdb" out/ -ErrorAction SilentlyContinue
          } else {
            Copy-Item "$bin/*.exe" out/
            Copy-Item "$bin/*.pdb" out/ -ErrorAction SilentlyContinue
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          # bin-* artifacts go into the main zip; the profiled one is packaged on its own
          name: ${{ matrix.buildconf == 'ProfiledDX11' && 'profiled' || 'bin' }}-${{ matrix.buildconf }}
          path: out/*
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  shader_packs:
    name: Shader packs (GAMMA)
    runs-on: ubuntu-latest
    env:
      # The repository name is read as a variable or, if it was added as a secret, as a secret
      SOURCES_REPO: ${{ vars.PBR_SOURCES_REPO || secrets.PBR_SOURCES_REPO }}
      SOURCES_TOKEN: ${{ secrets.PBR_SOURCES_TOKEN }}
      # DirectX Shader Compiler for the compile check, pinned (version + SHA-256)
      DXC_URL: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2407/linux_dxc_2024_07_31.x86_64.tar.gz
      DXC_SHA256: b58725ac191df0686994fb9d54d27ee8dd3f180b023d562733112a499ea1195c
    steps:
      - name: Sources configured?
        id: cfg
        run: |
          if [ -n "$SOURCES_REPO" ] && [ -n "$SOURCES_TOKEN" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            # Say which one is missing (never their values). Both must be repository-level
            # (Settings > Secrets and variables > Actions), not environment-level: this job
            # does not use an environment, so environment secrets/variables are invisible to it.
            [ -z "$SOURCES_REPO" ] && echo "::warning::PBR_SOURCES_REPO is empty: add it as a repository Variable (Variables tab), value owner/name of the private shader repository"
            [ -z "$SOURCES_TOKEN" ] && echo "::warning::PBR_SOURCES_TOKEN is empty: add it as a repository Secret (Secrets tab)"
            echo "::notice::no GAMMA shader installer in this release"
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.on == 'true'
        uses: actions/checkout@v4

      - name: Checkout the shader sources (private)
        if: steps.cfg.outputs.on == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCES_REPO }}
          token: ${{ secrets.PBR_SOURCES_TOKEN }}
          path: shader-sources
          lfs: true
          persist-credentials: false

      - name: Set up DXC and py7zr
        if: steps.cfg.outputs.on == 'true'
        run: |
          set -euo pipefail
          curl -sSL -o dxc.tgz "$DXC_URL"
          echo "$DXC_SHA256  dxc.tgz" | sha256sum -c -
          mkdir -p dxc && tar xzf dxc.tgz -C dxc
          echo "LD_LIBRARY_PATH=$PWD/dxc/lib" >> "$GITHUB_ENV"
          pip install --quiet py7zr

      - name: Build the shader packs and PBR_shaders_GAMMA_FOMOD.zip
        if: steps.cfg.outputs.on == 'true'
        run: |
          set -euo pipefail
          dxc="$PWD/dxc/bin/dxc"
          build=.github/pbr-release/build_shader_packs.py
          # Plain GAMMA stack: overlay + full pack (FOMOD variants "overlay" and "full")
          python $build --sources shader-sources --out shader_packs/plain --dxc "$dxc"
          dlss=()
          if [[ "$GITHUB_REF_NAME" == *-dlss ]]; then
            # Again with brodrigz's DLSS patch folded on top (variants "overlay_dlss", "full_dlss")
            mkdir -p dlss_patch && unzip -q "$DLSS_PATCH_ZIP" -d dlss_patch
            top=()
            for c in $DLSS_PATCH_COMPONENTS; do
              [ -d "dlss_patch/components/$c" ] || { echo "::error::DLSS patch has no component $c"; exit 1; }
              top+=(--top-layer "dlss_patch/components/$c")
            done
            python $build --sources shader-sources --out shader_packs/dlss --dxc "$dxc" "${top[@]}"
            dlss=(--dlss-overlay shader_packs/dlss/PBR_overlay_GAMMA.zip --dlss-full shader_packs/dlss/PBR_shaders_GAMMA.zip)
          fi
          # One Mod Organizer installer instead of loose zips
          python tools/make_shader_fomod.py --overlay shader_packs/plain/PBR_overlay_GAMMA.zip \
              --full shader_packs/plain/PBR_shaders_GAMMA.zip "${dlss[@]}" \
              --version "$(date -u +'%Y.%-m.%-d')-${GITHUB_SHA::8}" --out shader_packs/PBR_shaders_GAMMA_FOMOD.zip

      - name: Upload
        if: steps.cfg.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shader-packs
          path: shader_packs/PBR_shaders_GAMMA_FOMOD.zip
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  release:
    name: Package and publish
    needs: [ pack_gamedata, build, shader_packs ]
    # Ship even when the shader packs failed or were skipped (just without them)
    if: ${{ !cancelled() && needs.pack_gamedata.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Version
        id: v
        run: |
          date=$(date -u +'%Y.%-m.%-d')
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          mode="${{ github.event_name == 'push' && 'latest' || inputs.release }}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          version="${{ inputs.version }}"
          [ -z "$version" ] && version="$date"
          # Per-branch release names: "" for pbr-test-s3ds-mt-sss, "-lass" for
          # pbr-test-s3ds-mt-sss-lass, "-<branch>" for anything else
          branch="${GITHUB_REF_NAME}"
          suffix="${branch#pbr-test-s3ds-mt-sss}"
          [ "$suffix" = "$branch" ] && suffix="-${branch//\//-}"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "versioned" ]; then
            echo "tag=pbr-test${suffix}-$version" >> "$GITHUB_OUTPUT"
            echo "name=${{ env.PACKAGE_NAME }}${suffix}_$version" >> "$GITHUB_OUTPUT"
          else
            echo "tag=pbr-test${suffix}-latest" >> "$GITHUB_OUTPUT"
            echo "name=${{ env.PACKAGE_NAME }}${suffix}_latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble packages
        run: |
          set -euo pipefail
          notes=.github/pbr-release/RELEASE_NOTES.md
          sed -e "s/{{SHA}}/${GITHUB_SHA}/g" -e "s/{{SHORT_SHA}}/${{ steps.v.outputs.sha }}/g" \
              -e "s/{{DATE}}/${{ steps.v.outputs.date }}/g" -e "s|{{REPO}}|${GITHUB_REPOSITORY}|g" \
              "$notes" > notes.md

          mkdir -p pkg/bin pkg/db/mods
          cp artifacts/gamedata/*.db0 pkg/db/mods/
          for d in artifacts/bin-*; do cp "$d"/*.exe pkg/bin/; done
          # oneTBB runtime: the exes' task scheduler (_thread_types.h) loads it at startup
          if [ -f sdk/binaries/tbb12.dll ]; then cp sdk/binaries/tbb12.dll pkg/bin/; fi
          if [[ "$GITHUB_REF_NAME" == *-dlss ]]; then
            # NVIDIA's DLSS runtime next to the exes (pinned version and checksum)
            curl -sSL --fail -o pkg/bin/nvngx_dlss.dll "$DLSS_DLL_URL"
            echo "$DLSS_DLL_SHA256  pkg/bin/nvngx_dlss.dll" | sha256sum -c -
            # The DLSS / FSR3 shader compatibility patch, as its author ships it
            cp "$DLSS_PATCH_ZIP" .
          fi
          # PDBs (debug symbols, large) go in their own zip: dropped next to the exes they make
          # crash logs readable
          mkdir -p pdb
          for d in artifacts/bin-*; do cp "$d"/*.pdb pdb/ 2>/dev/null || true; done
          cp notes.md pkg/README-PBR.md
          (cd pkg && zip -qr "../${{ steps.v.outputs.name }}.zip" .)
          (cd pdb && zip -qr "../${{ steps.v.outputs.name }}_pdb.zip" . ) || true

          mkdir -p tools_pkg/tools
          cp tools/make_pbr_compat_patch.py tools/make_pbr_overlay.py tools/build_shader_pack.py tools/pack_pbr_textures.py tools/make_shader_fomod.py tools_pkg/tools/
          cp notes.md tools_pkg/README-PBR.md
          (cd tools_pkg && zip -qr "../${{ steps.v.outputs.name }}_tools.zip" .)

          # Profiled DX11 exe (Optick), when that leg built
          if ls artifacts/profiled-ProfiledDX11/AnomalyDX11_Profiled.exe >/dev/null 2>&1; then
            mkdir -p prof_pkg/bin prof_pkg/symbols
            cp artifacts/profiled-ProfiledDX11/AnomalyDX11_Profiled.exe prof_pkg/bin/
            cp artifacts/profiled-ProfiledDX11/*.pdb prof_pkg/symbols/ 2>/dev/null || true
            cat > prof_pkg/README-PROFILED.txt <<'TXT'
          Profiled DX11 exe (Optick profiler compiled in), same commit as the main zip.

          - Install the main zip first, then put bin/AnomalyDX11_Profiled.exe into the game's bin/
            next to AnomalyDX11.exe and start it instead (in Mod Organizer: add it as an executable).
          - Start the Optick GUI and connect to the game; Capture records CPU events, the engine's
            tags and the worker threads. Use a GUI from the same Optick generation as the engine:
            src/3rd party/optick-git is bombomby/optick at 8abd28d (July 2022, the 1.4 line).
          - symbols/AnomalyDX11.pdb is this exe's PDB under the name the linker wrote into it. It is
            only needed for sampled callstacks or a debugger: to use it, run a separate copy of bin/
            with this exe renamed back to AnomalyDX11.exe and the PDB next to it. Do not drop it next
            to the release AnomalyDX11.exe (wrong symbols).
          - Slower than the release exe; use it for profiling, not for playing.
          TXT
            (cd prof_pkg && zip -qr "../${{ steps.v.outputs.name }}_profiled.zip" .)
          else
            echo "::notice::no profiled exe in this release (ProfiledDX11 skipped or failed)"
          fi

          # GAMMA shader installer (job shader_packs), when it ran and succeeded
          if ls artifacts/shader-packs/*.zip >/dev/null 2>&1; then
            cp artifacts/shader-packs/*.zip .
          else
            echo "::notice::no GAMMA shader installer in this release (shader_packs skipped or failed)"
          fi
          ls -la *.zip

      - name: Upload run artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.name }}
          path: "*.zip"
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Publish release
        if: steps.v.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          if [ "${{ steps.v.outputs.mode }}" = "latest" ]; then
            # Rolling release: replace the previous one and move its tag to this commit
            gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
            title="PBR-Test${{ steps.v.outputs.suffix }} latest build (${{ steps.v.outputs.date }}, ${{ steps.v.outputs.sha }})"
            flags="--prerelease"
          else
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release $tag already exists; pass another version"; exit 1
            fi
            title="PBR-Test${{ steps.v.outputs.suffix }} ${tag#pbr-test${{ steps.v.outputs.suffix }}-}"
            flags=""
          fi
          gh release create "$tag" *.zip --target "$GITHUB_SHA" --title "$title" --notes-file notes.md $flags
